name: Parity
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - id: keys
        run: echo "claude=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Run parity
        id: parity
        continue-on-error: true
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
          FIGMA_CARD_SET_ID: ${{ vars.FIGMA_CARD_SET_ID }}
        run: npm run parity
      - name: Write the issue with Claude
        if: steps.parity.outcome == 'failure' && steps.keys.outputs.claude == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm i -g @anthropic-ai/claude-code
          claude -p "Read parity-report.md. Write a GitHub issue for the design system owner. Title under 70 characters. Body: what drifted in one paragraph, who most likely changed it and when (say unknown if the report does not say), the decision the owner has to make, and the command to re-run the check. Plain sentences, sentence case, no em dashes. Output only the issue body, the first line is the title." --output-format text > issue.md
          gh issue create --title "$(head -1 issue.md)" --body "$(tail -n +2 issue.md)" --label drift
      - name: Fallback issue without Claude
        if: steps.parity.outcome == 'failure' && steps.keys.outputs.claude == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Parity drift detected" --body-file parity-report.md --label drift
